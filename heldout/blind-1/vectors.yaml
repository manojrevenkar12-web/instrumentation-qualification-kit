# Held-out codec vectors, set blind-1.
# Written by an independent Claude session from docs/icd/*.md only (see README.md).
# Payloads exclude framing and any CRC trailer. Field values are raw integers.
cases:
  - name: aam heartbeat operational, overrange and config_crc bits
    icd: aam
    message: aam_heartbeat
    payload_hex: "02071200"   # 4 bytes
    expect: decode
    fields: {state: 2, counter: 7, errors: 18}
  - name: aam heartbeat one byte short
    icd: aam
    message: aam_heartbeat
    payload_hex: "020712"   # 3 bytes
    expect: reject
  - name: aam heartbeat one byte long
    icd: aam
    message: aam_heartbeat
    payload_hex: "0207120000"   # 5 bytes
    expect: reject
  - name: aam data group 3, i16 extremes and minus one
    icd: aam
    message: aam_data
    payload_hex: "03c80080ff7fffff"   # 8 bytes
    expect: decode
    fields: {mux: 3, counter: 200, ch_a: -32768, ch_b: 32767, ch_c: -1}
  - name: aam data distinct bytes per field (byte order check)
    icd: aam
    message: aam_data
    payload_hex: "01423412cced0201"   # 8 bytes
    expect: decode
    fields: {mux: 1, counter: 66, ch_a: 4660, ch_b: -4660, ch_c: 258}
  - name: aam data one byte short
    icd: aam
    message: aam_data
    payload_hex: "03c80080ff7fff"   # 7 bytes
    expect: reject
  - name: aam data one byte long
    icd: aam
    message: aam_data
    payload_hex: "03c80080ff7fffff55"   # 9 bytes
    expect: reject
  - name: aam register write request, divisor of channel 5 (unaligned u16 index)
    icd: aam
    message: aam_reg_request
    payload_hex: "2305200314000000"   # 8 bytes
    expect: decode
    fields: {cmd: 35, index: 8197, sub: 3, value: 20}
  - name: aam register read response, config_crc
    icd: aam
    message: aam_reg_response
    payload_hex: "43011f00efbeadde"   # 8 bytes
    expect: decode
    fields: {cmd: 67, index: 7937, sub: 0, value: 3735928559}
  - name: aam register abort response, u32 max abort code
    icd: aam
    message: aam_reg_response
    payload_hex: "800b2002ffffffff"   # 8 bytes
    expect: decode
    fields: {cmd: 128, index: 8203, sub: 2, value: 4294967295}
  - name: aam nmt start node 32
    icd: aam
    message: aam_nmt
    payload_hex: "0120"   # 2 bytes
    expect: decode
    fields: {cmd: 1, node: 32}
  - name: aam nmt one byte short
    icd: aam
    message: aam_nmt
    payload_hex: "81"   # 1 bytes
    expect: reject
  - name: imu sample, all fields set
    icd: imu
    message: imu_sample
    payload_hex: "02010d0c0b0a87d612003235dcffd8298500f807f1ff393000001069ef00e90907"   # 33 bytes
    expect: decode
    fields: {seq: 258, t_us: 168496141, gyro_x: 1234567, gyro_y: -2345678, gyro_z: 8727000, accel_x: -981000, accel_y: 12345, accel_z: 15690000, temp: 2537, status: 7}
  - name: imu sample at the negative ends of every ICD range, u16/u32 maxima
    icd: imu
    message: imu_sample
    payload_hex: "ffffffffffff28d67aff28d67aff28d67afff09610fff09610fff09610ff60f00f"   # 33 bytes
    expect: decode
    fields: {seq: 65535, t_us: 4294967295, gyro_x: -8727000, gyro_y: -8727000, gyro_z: -8727000, accel_x: -15690000, accel_y: -15690000, accel_z: -15690000, temp: -4000, status: 15}
  - name: imu sample at the positive ends of every ICD range
    icd: imu
    message: imu_sample
    payload_hex: "000000000000d8298500d8298500d82985001069ef001069ef001069ef00342100"   # 33 bytes
    expect: decode
    fields: {seq: 0, t_us: 0, gyro_x: 8727000, gyro_y: 8727000, gyro_z: 8727000, accel_x: 15690000, accel_y: 15690000, accel_z: 15690000, temp: 8500, status: 0}
  - name: imu sample minus one in every signed field
    icd: imu
    message: imu_sample
    payload_hex: "010001000000ffffffffffffffffffffffffffffffffffffffffffffffffffff08"   # 33 bytes
    expect: decode
    fields: {seq: 1, t_us: 1, gyro_x: -1, gyro_y: -1, gyro_z: -1, accel_x: -1, accel_y: -1, accel_z: -1, temp: -1, status: 8}
  - name: imu sample one byte short
    icd: imu
    message: imu_sample
    payload_hex: "02010d0c0b0a87d612003235dcffd8298500f807f1ff393000001069ef00e909"   # 32 bytes
    expect: reject
  - name: imu sample one byte long
    icd: imu
    message: imu_sample
    payload_hex: "02010d0c0b0a87d612003235dcffd8298500f807f1ff393000001069ef00e9090700"   # 34 bytes
    expect: reject
  - name: imu bit result, failed with code 0x0102
    icd: imu
    message: imu_bit_result
    payload_hex: "010201"   # 3 bytes
    expect: decode
    fields: {result: 1, code: 258}
  - name: imu command run self-test, arg u16 max
    icd: imu
    message: imu_command
    payload_hex: "03ffff"   # 3 bytes
    expect: decode
    fields: {cmd: 3, arg: 65535}
  - name: imu command one byte long
    icd: imu
    message: imu_command
    payload_hex: "01000000"   # 4 bytes
    expect: reject
  - name: gnss time pulse, 3D fix, all flags
    icd: gnss
    message: time_pulse
    payload_hex: "57090070991412030719000000"   # 13 bytes
    expect: decode
    fields: {week: 2391, tow_ms: 345600000, leap_s: 18, fix: 3, flags: 7, acc_ns: 25}
  - name: gnss time pulse, last ms of the week, u16/u32 maxima, no fix
    icd: gnss
    message: time_pulse
    payload_hex: "ffffff830c24000000ffffffff"   # 13 bytes
    expect: decode
    fields: {week: 65535, tow_ms: 604799999, leap_s: 0, fix: 0, flags: 0, acc_ns: 4294967295}
  - name: gnss time pulse one byte short
