    expect: decode
    fields: {type_sdo: 9, version: 2, length: 54, domain: 0, minor_sdo: 0, flags: 0, correction: 65536, type_specific: 0, clock_identity: 4822678189205111, port_number: 1, sequence_id: 1, control: 3, log_interval: 0, receive_s: 1762128000, receive_ns: 500, req_clock_identity: 9843086184167632639, req_port_number: 65535}
