# Interface control document: telemetry and diagnostics from the data acquisition unit (DAU), UDP.
icd: DAU-UDP
title: Data acquisition unit telemetry and diagnostics, UDP/IPv4
version: 1.3.0
byte_order: little
transport:
  kind: udp
  telemetry_port: 47000
  diag_port: 47001
  trailer: crc32       # CRC-32 (IEEE) over the whole datagram before the trailer
messages:
  - name: tlm_packet
    id: 0x50
    direction: device_to_host
    description: One packet per output frame. Samples carry the time of acquisition, not of sending.
    fields:
      - {name: magic, type: u32, description: "0x4B514954 ('TIQK')."}
      - {name: seq, type: u32}
      - {name: time_ns, type: u64, unit: ns, description: UTC nanoseconds of the frame's first sample.}
      - name: time_quality
        type: u8
        description: "0 free-running, 1 holdover, 2 locked to GNSS, 3 locked to PTP."
        range: [0, 3]
      - {name: plan_crc, type: u32, description: CRC-32 of the measurement plan in force.}
      - name: samples
        type: array
        count: u8
        max: 48
        of:
          - {name: channel, type: u16}
          - {name: dt_us, type: u16, unit: us, description: Offset from time_ns.}
          - {name: value, type: i32, scale: 1.0e-4, description: Engineering units per the plan.}
          - name: flags
            type: u8
            bits: {stale: 0, overrange: 1, alarm_low: 2, alarm_high: 3}
  - name: diag_request
    id: 0x40
    direction: host_to_device
    fields:
      - {name: what, type: u8, range: [1, 2], description: "1 status, 2 fault log."}
  - name: diag_status
    id: 0x41
    direction: device_to_host
    fields:
      - {name: uptime_s, type: u32}
      - {name: sw_version, type: u32, description: "major<<16 | minor<<8 | patch."}
      - {name: slot, type: u8, description: Boot slot, 0 A or 1 B.}
      - name: bit
        type: u16
        bits: {imu: 0, aam: 1, gnss: 2, ptp: 3, plan: 4, storage: 5}
      - {name: time_state, type: u8, description: "0 free-running, 1 locking, 2 locked, 3 holdover."}
      - {name: time_source, type: u8, description: "0 none, 1 GNSS, 2 PTP."}
      - {name: offset_ns, type: i32}
      - {name: imu_crc_errors, type: u32}
      - {name: imu_gaps, type: u32}
      - {name: can_errors, type: u32}
      - {name: plan_crc, type: u32}
      - {name: faults_logged, type: u16}
  - name: diag_faults
    id: 0x42
    direction: device_to_host
    description: The most recent fault records, oldest first.
    fields:
      - {name: total, type: u32, description: Faults logged since boot, folded repeats included.}
      - name: records
        type: array
        count: u8
        max: 32
        of:
          - {name: local_ms, type: u32, unit: ms, description: Unit uptime when the fault was first seen.}
          - {name: code, type: u16}
          - {name: detail, type: i32}
          - {name: count, type: u16, description: Repeats folded into this record.}
